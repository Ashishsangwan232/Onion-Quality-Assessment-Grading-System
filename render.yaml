# Render Blueprint: New + > Blueprint > pick this repo.
services:
  - type: web
    name: onion-quality-grading
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # 512 MB: too small for the models, so ONION_DEMO=1 shows a pre-computed result.
                            # On 'standard' (2 GB) set ONION_DEMO to 0 to grade uploads for real.
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: ONION_DISABLE_LIVE   # no camera on a server: hide the Live camera tab
        value: "1"
      - key: ONION_DEMO           # free tier: show the saved demo result, load no models
        value: "1"
      - key: ONION_DEVICE
        value: cpu
